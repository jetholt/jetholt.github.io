---
layout: compress
---
<!DOCTYPE html>
<html>
  	<head>
		{% assign cacheBust = site.time | date:'?v=%s' %}
		<meta charset='utf-8'>
		<meta http-equiv='X-UA-Compatible' content='IE=edge'>
		<meta name='viewport' content='width=device-width, initial-scale=1'>
		<meta name='description' content='{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}'>
		<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
		{% if page.custom_css %}
		<link href='{{ site.baseurl }}/assets/{{ page.custom_css }}.css{{ cacheBust }}' rel='stylesheet' type='text/css'>
		{% endif %}
		{% if page.custom_favicon %}
		<link rel="shortcut icon" type="image/x-icon" href="/assets/images/{{ page.custom_favicon }}.png">
		{% endif %}
	</head>
  	<body>
  	{{ content }}
	</body>
	{% if page.custom_js %}
	<script src='{{ site.baseurl }}/assets/{{ page.custom_js }}.js{{ cacheBust }}'></script>
	{% endif %}
</html>
