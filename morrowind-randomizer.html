---
layout: default
title: Morrowind Randomizer
---
<header>
    <img src="/assets/images/moon-and-star.png"/>
    <span>Morrowind Randomizer</span>
</header>
<main id="app">
    <div id="inner-content">
        <section>
            <div class="wrapper elements-wrapper" id="race-wrapper">
                <input type="image" src="/assets/images/reroll-race.png"/>
                <label>Race</label>
                <div id="race"></div>
            </div>
            <div class="wrapper elements-wrapper" id="birthsign-wrapper">
                <input type="image" src="/assets/images/reroll-birthsign.png"/>
                <label>Birthsign</label>
                <div id="birthsign"></div>
            </div>
        </section>
        <section id="class-wrapper">
            <input type="image" src="/assets/images/reroll-class.png"/>
            <div class="elements-wrapper">
                <div class="wrapper elements-wrapper">
                    <div id="class-name-wrapper">
                        <label>Class Name</label>
                        <div id="class-name"></div>
                    </div>
                    <div id="class-specialization-wrapper">
                        <label>Specialization</label>
                        <div id="class-specialization"></div>
                    </div>
                    <div id="class-attributes-wrapper">
                        <label>Attributes</label>
                        <ul id="class-attributes"></ul>
                    </div>
                </div>
                <div id="class-major-skills-wrapper" class="wrapper elements-wrapper">
                    <label>Major Skills</label>
                    <ul id="class-major-skills"></ul>
                </div>
                <div id="class-minor-skills-wrapper" class="wrapper elements-wrapper">
                    <label>Minor Skills</label>
                    <ul id="class-minor-skills"></ul>
                </div>
            </div>
        </section>
        <section class="wrapper" id="objective-wrapper">
            <input type="image" src="/assets/images/reroll-objective.png"/>
            <label>Objective</label>
            <div id="objective"></div>
        </section>
        <section class="wrapper" id="stipulations-wrapper">
            <input type="image" src="/assets/images/reroll-stipulations.png"/>
            <label>Stipulations</label>
            <ul id="stipulations">
            </ul>
        </section>
    </div>
</main>
